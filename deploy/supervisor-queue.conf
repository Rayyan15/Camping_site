; Queue worker untuk Supervisor. Sesuaikan path, user, dan jumlah proses dengan server.
; Setelah rilis, jalankan `php artisan queue:restart` agar worker memuat kode baru.
[program:camping-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/camping/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/camping/storage/logs/queue-worker.log
stopwaitsecs=3600
